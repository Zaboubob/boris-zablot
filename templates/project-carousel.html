<div class="project-carousel" data-project-carousel role="region" aria-roledescription="carousel" aria-label="$gallery_label">
  <div class="project-carousel-footer">
    <p class="project-carousel-hint">$hint</p>
    <div class="project-carousel-controls" hidden>
      <button type="button" data-previous aria-label="$previous_label" aria-controls="project-track"><span aria-hidden="true">←</span><span>$previous_label</span></button>
      <span class="project-carousel-count" aria-live="polite" aria-atomic="true">1</span>
      <button type="button" data-next aria-label="$next_label" aria-controls="project-track"><span>$next_label</span><span aria-hidden="true">→</span></button>
    </div>
  </div>
  <div class="project-track" id="project-track" tabindex="0" aria-label="$gallery_label">
$cards
  </div>
</div>
<script src="${script_prefix}assets/projects.js?v=2" defer></script>
