<div class="project-carousel" data-project-carousel role="region" aria-label="$gallery_label">
  <div class="project-track" id="project-track" tabindex="0" aria-label="$gallery_label">
$cards
  </div>
  <div class="project-carousel-footer">
    <p class="project-carousel-hint">$hint</p>
    <div class="project-carousel-controls" hidden>
      <button type="button" data-previous aria-label="$previous_label" aria-controls="project-track"><span aria-hidden="true">←</span></button>
      <button type="button" data-next aria-label="$next_label" aria-controls="project-track"><span aria-hidden="true">→</span></button>
    </div>
  </div>
</div>
<script src="${script_prefix}assets/projects.js" defer></script>
