<a class="project-card" href="$url" aria-labelledby="card-$id-title" aria-describedby="card-$id-summary">
  <div class="project-card-media">$image<span class="project-number">$number</span></div>
  <div class="project-content">
    <div class="project-meta"><span>$category</span><span class="project-status">$status</span></div>
    <h3 id="card-$id-title">$title</h3>
    <p id="card-$id-summary">$teaser</p>
    <span class="project-link">$discover_label <span aria-hidden="true">↗</span></span>
  </div>
</a>
